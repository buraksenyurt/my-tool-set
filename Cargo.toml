[workspace]
resolver = "3"
members = ["crates/mts-core", "crates/mts-catalog", "crates/mts-runner", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Burak Selim Senyurt"]

[workspace.dependencies]
mts-core = { path = "crates/mts-core" }
mts-catalog = { path = "crates/mts-catalog" }
mts-runner = { path = "crates/mts-runner" }
libc = "0.2"
ammonia = "4"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
# TLS through ring rather than reqwest's default aws-lc-rs: no extra build tools
# on Windows. Certificates are verified against the OS store (platform verifier).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

[profile.dev.package."*"]
opt-level = 1
