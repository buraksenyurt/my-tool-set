name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kontrol ve testler
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Linux bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check
      # src-tauri derlenirken ../dist klasörü hazır olmalı
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # ts-rs regenerates src/lib/bindings during the tests; committed types must match
      - name: TypeScript tipleri güncel mi?
        run: git diff --exit-code -- src/lib/bindings
