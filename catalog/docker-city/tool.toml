schema = 0

id       = "docker-city"
name     = "DockerCity"
summary  = "docker-compose servislerini oyunlaştırılmış bir şehir haritası olarak gösterir."
category = "docker"
kind     = "gui"
stack    = ["C#", ".NET 10", "WinUI 3", "YamlDotNet", "EF Core"]
tags     = ["docker", "compose", "görselleştirme"]

[release]
repo = "buraksenyurt/docker-city"

[source]                         # release tag'indeki repo içeriğine göre göreli
readme = "README.md"
screenshots = ["Runtime_12.png"]

[platforms]
windows = "yes"
linux   = "no"                    # WinUI 3
macos   = "no"

[run]
host = "external"
