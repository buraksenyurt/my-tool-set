schema = 0

id       = "git-dash"
name     = "GitDash"
summary  = "Yerel bir git reposunun commit aktivitesini terminalde takvim ısı haritası olarak gösterir."
category = "git"
kind     = "cli"
stack    = ["Zig 0.17"]
tags     = ["git", "terminal"]

[release]
repo = "buraksenyurt/git-dash"

[source]                         # release tag'indeki repo içeriğine göre göreli
readme = "README.md"
screenshots = ["runtime_00.png", "runtime_01.png"]

[platforms]
windows = "yes"
linux   = "yes"
macos   = "untested"

[run]
host = "terminal"

[[run.params]]
name  = "repo"
kind  = "folder"
label = "Repo klasörü"

[[run.params]]
name    = "days"
kind    = "number"
label   = "Kaç gün geriye"
default = 180
